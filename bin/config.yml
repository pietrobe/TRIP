# I/O
#input_directory: /gpfs/projects/ehpc597/in_Datasets/64x64/
#input_file:      AR_385_Cut_64x64_mirrorxy-CRD_I_V0_fix_conv_KQ_MC.pmd
#frequency_file:  frequency/96F/frequency.dat

#input_directory: ../input/PORTA/
#input_file:      cai_0Bx_0By_0Bz_1Vx_1Vy_1Vz_GT4_5x5x133_it100.pmd
#frequency_file:  frequency/96F/frequency.dat

input_directory: ../input/FAL-C/
input_file:      1_B0_V0_12T_8C_64F_64
frequency_file:  64F/frequency.dat

# input_directory: /gpfs/projects/ehpc597/model128/
# input_file:      small_ssd_from3D_8x8x143.h5
# frequency_file:  frequency/96F/frequency.dat

# atom_file: ../input/atom_CaI.yml

output: true
output_overwrite_prevention: false
output_directory: ../data
write_text_output: true

use_B: false
enable_continuum: false
formal_solver: BESSER
use_1_5D_approx: true

set_uniform_B: false
#B_field: [12.0, 0.78, 0.78]
B_scaling: 0.5

# use_D2_from_input: true # TEST
enable_sigma_c: true

use_Vb: false
Vb_scaling: 0.3
# set_uniform_Vb: true
# Vb_field: [10.0, 0.78, 0.78]  

# arbitrary_beams:
#  - mu: 1.0
#    chi: 0.0

emissivity_model: PRD
preconditioner_emissivity_model: CRD_limit

# used only for FAL-C input
N_theta: 8
N_chi: 16
N_x: 1
N_y: 1

use_prec: true

solver:
  ksp_solver_type: KSPRICHARDSON
  ksp_rtol: 1e-6
  ksp_max_it: 100
  ksp_use_J_KQ: false
  gmres_restart: 15

prec:
  pc_solver_type: KSPGMRES
  pc_rtol: 1e-6
  pc_max_it: 100
  pc_use_J_KQ: true
  pc_formal_solver_approx: true
  verbose: false
    
RII_contrib_block_margins:  [55, 90, 120, 150, 174]


