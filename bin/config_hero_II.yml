input_file: Muram_SSD_6Mm_1x1x143_CaI4227.h5

# frequency_file:  frequency/96F/freq_128_centered.dat
frequency_file:  frequency/96F/frequency.dat

output: true
output_overwrite_prevention: true

# output_directory: /gpfs/scratch/ehpc597/model128/CRD_limit_128x128_DL_PORTA_comparison
output_directory: /playground/simone/test_mu

RII_contrib_block_margins:  [55, 90, 120, 150, 174]
# atom_file: atom_SrII.yml

write_whole_3D_field_hdf5: false
write_text_output: false

use_B: true
use_Vb: false

formal_solver: BESSER
# formal_solver: DELO_linear

enable_sigma_c: true

emissivity_model: PRD
# preconditioner_emissivity_model: CRD_limit
preconditioner_emissivity_model: CRD_limit_NO_HANLE

# emissivity_model: PRD_AA_MAPV_NO_HANLE
# emissivity_model: PRD_AA_MAPV
# emissivity_model: PRD_NO_HANLE
# emissivity_model: PRD
# emissivity_model: CRD_limit

# used only for FAL-C input
N_theta: 8
N_chi:   16

# could be ideal for the 8 x 16 case.
# ensure a reasonable job and memory balance
RII_contrib_block_margins:  [55, 90, 120, 150, 174]

use_prec: true

solver:
  ksp_solver_type: KSPRICHARDSON
  ksp_rtol: 1e-6
  ksp_max_it: 25
  verbose: true

prec:
  pc_solver_type: KSPFGMRES
  pc_rtol: 1e-6
  pc_max_it: 25
  pc_use_J_KQ: true
  verbose: true
  pc_formal_solver_approx: true


