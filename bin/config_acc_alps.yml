# I/O
input_directory: /capstor/scratch/cscs/sriva/PORTA/
# input_file: cai_1Bx_1By_1Bz_1Vx_1Vy_1Vz_GT4_32x32x133.pmd
input_file:      cai_0Bx_0By_0Bz_1Vx_1Vy_1Vz_GT4_5x5x133_it100.pmd
frequency_file:  frequency/96F/frequency.dat

output: true
output_overwrite_prevention: true
output_directory: /capstor/scratch/cscs/sriva/PORTA/output/f3D_test_z3/
write_whole_3D_field_hdf5: true

use_B: true
use_Vb: false
use_continuum: false
formal_solver: BESSER

set_uniform_B: true
B_field: [5.0, 0.78, 0.78]

emissivity_model: PRD  

# used only for FAL-C input
N_theta: 8
N_chi:   16

input_cul_string:  ""
input_qel_string:  ""
input_llp_string:  ""
input_back_string: ""

use_prec: true

solver:
  ksp_solver_type: KSPGMRES
  ksp_rtol: 1e-7
  ksp_max_it: 7

prec:
  pc_solver_type: KSPGMRES
  pc_rtol: 1e-6
  pc_max_it: 27

default_chi: &default_chi 0.0

arbitrary_beams: 
  - mu: 0.1
    chi: *default_chi

  - mu: 0.3
    chi: *default_chi
    
  - mu: 0.7
    chi: *default_chi

  - mu: 1.0
    chi: *default_chi

  - mu:  3.30009478207572e-01
    chi: 1.96349540849362e-01
